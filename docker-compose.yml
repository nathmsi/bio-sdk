version: '3.9'

services:
  server:
    build: .
    ports:
      - '9000:9000'
    environment:
      NODE_ENV: production
      PORT: 9000
      LOG_LEVEL: info
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:9000/health']
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
