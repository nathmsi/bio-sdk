name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint + Typecheck + Test + Build ─────────────────────────────────────────
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build protocol + sdk (required for typecheck)
        run: |
          pnpm --filter @bio-sdk/protocol build
          pnpm --filter @bio-sdk/sdk build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test

      - name: Build all packages
        run: pnpm build

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=critical
      - uses: github/codeql-action/init@v3
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@v3

  # ── Deploy to Render (main branch only) ──────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy — server
        if: vars.RENDER_SERVER_DEPLOY_HOOK != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_SERVER_DEPLOY_HOOK }}" \
            -H "Accept: application/json" | jq .
        continue-on-error: true

      - name: Trigger Render deploy — dashboard
        if: vars.RENDER_DASHBOARD_DEPLOY_HOOK != ''
        run: |
          curl -s -X POST "${{ vars.RENDER_DASHBOARD_DEPLOY_HOOK }}" \
            -H "Accept: application/json" | jq .
        continue-on-error: true

      - name: Skip (deploy hooks not configured)
        if: vars.RENDER_SERVER_DEPLOY_HOOK == '' && vars.RENDER_DASHBOARD_DEPLOY_HOOK == ''
        run: echo "Render deploy hooks not set — skipping. See README for setup."
