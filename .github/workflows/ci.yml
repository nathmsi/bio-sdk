name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint + Typecheck + Test + Build ─────────────────────────────────────────
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build protocol + sdk (required for typecheck)
        run: |
          pnpm --filter @bio-sdk/protocol build
          pnpm --filter @bio-sdk/sdk build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (with coverage)
        run: pnpm test

      - name: Build all packages
        run: pnpm build

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=critical
      - uses: github/codeql-action/init@v3
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@v3

  # ── Deploy to Render (main branch only) ──────────────────────────────────────
  deploy:
    name: Deploy to Render
    needs: [verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render deploy — server
        run: |
          STATUS=$(curl -s -o /tmp/render-server.json -w "%{http_code}" -X POST \
            "${{ vars.RENDER_SERVER_DEPLOY_HOOK }}" -H "Accept: application/json")
          cat /tmp/render-server.json
          echo "HTTP $STATUS"
          [[ "$STATUS" -ge 200 && "$STATUS" -lt 300 ]] || exit 1

      - name: Trigger Render deploy — dashboard
        run: |
          STATUS=$(curl -s -o /tmp/render-dashboard.json -w "%{http_code}" -X POST \
            "${{ vars.RENDER_DASHBOARD_DEPLOY_HOOK }}" -H "Accept: application/json")
          cat /tmp/render-dashboard.json
          echo "HTTP $STATUS"
          [[ "$STATUS" -ge 200 && "$STATUS" -lt 300 ]] || exit 1
