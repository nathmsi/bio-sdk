services:
  # ── API Server (Docker) ────────────────────────────────────────────────────
  - type: web
    name: bio-sdk-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                     # upgrade to starter for always-on
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: true               # deploys automatically on every push to main

  # ── Dashboard (Static Site) ───────────────────────────────────────────────
  - type: web
    name: bio-sdk-dashboard
    runtime: static
    buildCommand: >
      npm install -g pnpm@9 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @bio-sdk/protocol build &&
      pnpm --filter @bio-sdk/sdk build &&
      pnpm --filter @bio-sdk/dashboard build
    staticPublishPath: ./apps/dashboard/dist
    plan: free
    envVars:
      # Set this to the bio-sdk-server URL after the first deploy
      # e.g. https://bio-sdk-server.onrender.com
      - key: VITE_API_URL
        sync: false                # you fill this in Render's dashboard
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # SPA fallback
    autoDeploy: true
