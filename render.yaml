services:
  # ── API Server (Docker) ────────────────────────────────────────────────────
  - type: web
    name: bio-sdk-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        value: https://bio-sdk-dashboard.onrender.com
    healthCheckPath: /health
    autoDeploy: false

  # ── Dashboard (Static Site) ───────────────────────────────────────────────
  - type: web
    name: bio-sdk-dashboard
    runtime: static
    buildCommand: >
      npm install -g pnpm@11 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @bio-sdk/protocol build &&
      pnpm --filter @bio-sdk/sdk build &&
      pnpm --filter @bio-sdk/dashboard build
    staticPublishPath: ./apps/dashboard/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: false
